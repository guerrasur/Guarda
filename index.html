<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#202124">
<meta name="guarda-version" content="0.6.12">
<style>html{background:#202124}html:not([data-theme]) body{visibility:hidden}html[data-theme=light]{background:#fff}html[data-theme=dark]{background:#202124}</style>
<script>try{const theme=localStorage.getItem("guarda-theme");if(["dark","light","system"].includes(theme))document.documentElement.dataset.theme=theme==="dark"||theme==="system"&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}catch{}document.querySelector('meta[name=theme-color]').content=document.documentElement.dataset.theme==="light"?"#ffffff":"#202124";</script>
<meta name="description" content="Guarda tus ideas. Notas, listas y audios, siempre a mano, incluso sin conexión.">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Guarda">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="./src/styles.css"><title>Guarda</title>
</head>
<body>
<header class="header">
<button class="icon-button" id="menu-toggle" aria-label="Menú principal" aria-expanded="true"></button>
<a class="brand" href="#notes"><img src="./guardia-icon.svg" width="40" height="40" alt=""><span>Guarda<small id="version">v0.6.12</small></span></a>
<form class="search" role="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Buscar" aria-label="Buscar notas" autocomplete="off"><button type="button" class="icon-button" id="clear-search" aria-label="Borrar búsqueda" hidden></button></form>
<div class="header-actions"><span id="save-status" class="save-status" role="status">Guardado local</span><button class="icon-button" id="view-toggle" aria-label="Vista de lista"></button><button class="icon-button" id="settings-toggle" aria-label="Configuración"></button><button class="avatar" id="local-info" aria-label="Perfil y Google Drive"><span id="drive-indicator" class="profile-ring" role="status" aria-live="polite" hidden></span><img id="profile-image" src="./avatars/clover.png" alt=""></button></div>
</header>
<div class="scrim" id="nav-scrim" hidden></div>
<aside class="sidebar" id="sidebar" aria-label="Navegación"><nav id="navigation"></nav><div class="sidebar-bottom"><button class="nav-item" id="install-button"><span data-icon="download"></span><span>Instalar Guarda</span></button><p>Tu espacio para guardar ideas.</p><button class="nav-item" id="app-info"><span data-icon="info"></span><span>Información de la app</span></button></div></aside>
<main id="main">
<div id="selection-bar" class="selection-bar" hidden></div>
<div class="composer" id="composer"><button class="compose-start" id="new-note">Crear una nota…</button><button class="icon-button" id="new-list" aria-label="Nueva lista"></button><button class="icon-button" id="new-audio" aria-label="Grabar nota de audio"></button><button class="icon-button" id="new-image" aria-label="Nota nueva con imagen"></button></div>
<div id="page-heading" class="page-heading" hidden></div><div class="search-filters" id="search-filters" hidden></div>
<div id="notes-area" aria-live="polite"></div>
<div class="empty-state" id="empty-state" hidden><div id="empty-icon"></div><p id="empty-message"></p><button id="empty-create" class="text-button">Crear una nota</button></div>
</main>
<div class="mobile-bar"><button class="icon-button" id="mobile-list" aria-label="Nueva lista"></button><button class="icon-button" id="mobile-draw" aria-label="Nuevo dibujo"></button><button class="icon-button" id="mobile-audio" aria-label="Grabar nota de audio"></button><button class="icon-button" id="mobile-image" aria-label="Nota nueva con imagen"></button><button class="mobile-plus" id="mobile-add" aria-label="Crear una nota"></button></div>
<div class="modal-layer" id="editor-layer" hidden><section class="note-editor" id="editor" role="dialog" aria-modal="true" aria-label="Editar nota" tabindex="-1">
<div class="mobile-editor-top"><button class="icon-button" id="editor-back" aria-label="Cerrar nota"></button><span id="editor-mobile-status">Guardado</span></div>
<div class="editor-title-row"><input id="note-title" aria-label="Título" placeholder="Título" maxlength="1000"><button class="icon-button" id="editor-pin" aria-label="Fijar nota" aria-pressed="false"></button></div>
<div id="editor-images" class="editor-images"></div><div id="editor-body" contenteditable="true" role="textbox" aria-label="Texto de la nota" aria-multiline="true" data-placeholder="Crear una nota…"></div><div id="editor-checklist" hidden></div>
<div id="editor-audios" class="editor-audios"></div><div id="editor-files" class="editor-files"></div><div id="record-panel" class="record-panel" hidden><span class="record-dot"></span><span id="record-time">00:00</span><span id="record-label">Grabando audio</span><svg id="record-waveform" class="record-waveform" viewBox="0 0 320 48" preserveAspectRatio="none" role="img" aria-label="Nivel de sonido del micrófono"><path d="M0 24H320"/></svg><button class="icon-button" id="record-pause" aria-label="Pausar grabación"></button><button class="record-stop" id="record-stop" aria-label="Detener y guardar grabación"></button></div>
<div id="editor-labels" class="note-labels editor-labels"></div><div id="format-toolbar" class="format-toolbar" hidden><button data-format="bold" aria-label="Negrita"><b>B</b></button><button data-format="italic" aria-label="Cursiva"><i>I</i></button><button data-format="underline" aria-label="Subrayado"><u>U</u></button><button data-format="formatBlock" data-format-value="h2" aria-label="Encabezado">H</button><button data-format="removeFormat" aria-label="Quitar formato">Tx</button></div>
<div class="editor-footer"><div class="editor-tools"><button class="icon-button" id="editor-format" aria-label="Opciones de formato"></button><button class="icon-button" id="editor-color" aria-label="Opciones de fondo"></button><button class="icon-button" id="editor-reminder" aria-label="Recordarme"></button><button class="icon-button" id="editor-mic" aria-label="Grabar audio"></button><button class="icon-button" id="editor-image" aria-label="Adjuntar archivos"></button><button class="icon-button" id="editor-archive" aria-label="Archivar nota"></button><button class="icon-button" id="editor-more" aria-label="Más opciones"></button></div><button class="text-button" id="editor-close">Cerrar</button></div><div class="editor-meta" id="editor-meta"></div>
</section></div>
<div id="popover" class="popover" hidden></div>
<dialog id="utility-dialog" class="utility-dialog"><div id="utility-content"></div></dialog>
<dialog id="draw-dialog" class="draw-dialog"><div class="draw-top"><strong>Dibujo</strong><input type="color" id="pen-color" value="#202124" aria-label="Color del trazo"><input type="range" id="pen-width" min="1" max="16" value="3" aria-label="Grosor del trazo"><button class="icon-button" id="draw-clear" aria-label="Borrar dibujo"></button><button class="text-button" id="draw-cancel">Cancelar</button><button class="text-button" id="draw-save">Guardar</button></div><canvas id="draw-canvas" width="1000" height="700"></canvas></dialog>
<div class="drive-bar"><button id="drive-open" type="button">Google Drive</button><span id="drive-status" role="status">Drive sin conectar</span></div>
<div class="update-bar"><button id="update" type="button">Actualizar</button><span id="update-status" role="status" aria-live="polite"></span></div>
<div class="toast" id="toast" role="status" hidden><span></span><button></button></div>
<input type="file" id="attachment-file" multiple hidden><input type="file" id="image-file" accept="image/*" multiple hidden><input type="file" id="backup-file" accept="application/json,.json" hidden>
<script type="module" src="./src/app.js"></script>
</body></html>
