name: Comprobar publicación de Guarda
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar versión publicada en GitHub Pages y Worker de Cloudflare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const paths = [
            { name: 'GitHub Pages', url: 'https://guerrasur.github.io/Guarda/version.json?check=' + Date.now(), match: body => { try { return JSON.parse(body).version === '0.7.5'; } catch { return false; } } },
            { name: 'Cloudflare Worker OAuth', url: 'https://guarda-drive.luchoguerra33.workers.dev/oauth/launch?state=invalid&ticket=invalid', match: body => body.includes('Esta solicitud de conexión no está disponible') }
          ];
          const statusUrl = `https://api.github.com/repos/${process.env.REPO}/statuses/${process.env.COMMIT_SHA}`;
          async function report(state, description) {
            const res = await fetch(statusUrl, {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ state, context: 'guarda/live-deployment', description: description.slice(0,140), target_url: `https://github.com/${process.env.REPO}/actions` })
            });
            if (!res.ok) throw new Error('No se pudo informar el estado de publicación: HTTP ' + res.status);
          }
          await report('pending', 'Comprobando GitHub Pages y Cloudflare');
          let failures = 0;
          for (const target of paths) {
            let ready = false;
            for (let i=0;i<9;i++) {
              try {
                const response = await fetch(target.url, { signal: AbortSignal.timeout(12000), cache: 'no-store' });
                const body = await response.text();
                if (response.ok && target.match(body)) { console.log(target.name + ': actualizado'); ready = true; break; }
                console.log(target.name + ': pendiente (HTTP ' + response.status + ')');
              } catch (err) { console.log(target.name + ': sin respuesta (' + (err.name || 'error') + ')'); }
              if (i !== 8) await new Promise(resolve => setTimeout(resolve, 10000));
            }
            if (!ready) { console.error(target.name + ': requiere publicación o revisión manual de infraestructura'); failures++; }
          }
          await report(failures ? 'failure' : 'success', failures ? `${failures} servicio(s) pendientes de publicación` : 'Pages y Worker publicaron la versión esperada');
          if (failures) process.exitCode = 1;
          NODE
