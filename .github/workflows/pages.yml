name: Publicar Guarda en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: guarda-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar procesador de iconos
        run: python -m pip install --disable-pip-version-check 'CairoSVG==2.8.2' 'Pillow==11.3.0'
      - name: Generar favicon, PWA e iconos del sitio
        run: python scripts/render_icons.py
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Guardar versiones PNG en el repositorio
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/favicon.ico public/favicon-16x16.png public/favicon-32x32.png public/icon-192.png public/icon-512.png public/apple-touch-icon.png public/guardia-icon.png
          if ! git diff --cached --quiet; then
            git commit -m 'assets: regenerate Guarda favicons and PWA icons'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
